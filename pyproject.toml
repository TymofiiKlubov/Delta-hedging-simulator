[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhsim"
version = "0.1.0"
description = "Delta-hedging simulator: discrete hedging error, realised vs implied volatility, transaction costs, jumps and stochastic volatility."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
notebook = ["jupyter", "nbformat", "nbclient", "ipykernel"]

[project.scripts]
dhsim = "dhsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
